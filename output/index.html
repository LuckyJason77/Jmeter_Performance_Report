<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性能测试报告索引</title>
    <style>
        :root {
            --bg-primary: #0b0c0e;
            --bg-secondary: #141619;
            --bg-card: #1a1d21;
            --text-primary: #d1d5db;
            --text-secondary: #9ca3af;
            --border-color: #2a2f3a;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 8px;
        }

        .report-list {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .report-list h2 {
            font-size: 16px;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .report-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s;
        }

        .report-item:hover {
            background: var(--bg-secondary);
        }

        .report-item:last-child {
            border-bottom: none;
        }

        .report-info {
            flex: 1;
        }

        .report-name {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .report-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .report-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: var(--accent-blue);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .report-link:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>性能测试报告索引</h1>
            <p class="subtitle">生成时间：2026-10-10 09:07:58</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="label">报告总数</div>
                <div class="value" style="color: var(--accent-blue)">1</div>
            </div>
            <div class="stat-card">
                <div class="label">总样本数</div>
                <div class="value" style="color: var(--accent-green)">137</div>
            </div>
            <div class="stat-card">
                <div class="label">源文件数</div>
                <div class="value">1</div>
            </div>
        </div>

        <div class="report-list">
            <h2>报告列表</h2>
            
            <div class="report-item">
                <div class="report-info">
                    <div class="report-name">shutong-1010-results.jtl</div>
                    <div class="report-meta">137 条样本</div>
                </div>
                <a class="report-link" href="shutong-1010-results_report.html" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                        <polyline points="15 3 21 3 21 9"/>
                        <line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                    查看报告
                </a>
            </div>
            
        </div>

        <footer>
            <p>Generated by JMeter Report Generator</p>
        </footer>
    </div>
</body>
</html>
