<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>数通项目 · 多月进度路线图</title>
  <style>
    :root {
      --navy-950: #08152f;
      --navy-900: #0d1f42;
      --navy-800: #18335f;
      --blue-700: #174fbf;
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --teal-600: #0f9f8c;
      --orange-600: #9a3f12;
      --ink-900: #111c33;
      --ink-700: #33415c;
      --ink-500: #667085;
      --line-strong: #d7deea;
      --line-soft: #e8edf4;
      --surface: #ffffff;
      --surface-muted: #f7f9fc;
      --canvas: #eef2f7;
      --shadow-soft: 0 18px 48px rgba(13, 31, 66, 0.08);
      --shadow-card: 0 10px 30px rgba(13, 31, 66, 0.07);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 13px;
      --stage-width: 318px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--canvas);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink-900);
      background:
        radial-gradient(circle at 8% 0%, rgba(37, 99, 235, 0.08), transparent 30%),
        linear-gradient(180deg, #f7f9fc 0%, var(--canvas) 100%);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      text-rendering: optimizeLegibility;
    }

    body.editor-open {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 2px;
      box-shadow: 0 0 0 5px var(--blue-700);
    }

    [hidden] {
      display: none !important;
    }

    .app-shell {
      width: min(1920px, 100%);
      margin: 0 auto;
      padding: clamp(22px, 3vw, 50px);
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 24px;
    }

    .persistence-warning {
      margin: -4px 0 24px;
      padding: 14px 16px;
      border: 1px solid #f1c59e;
      border-radius: var(--radius-md);
      color: #74310f;
      background: #fff7ed;
      box-shadow: 0 8px 22px rgba(122, 46, 14, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .persistence-warning-copy {
      margin: 0;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.6;
    }

    .persistence-warning .button {
      flex: none;
      color: #74310f;
      border-color: #e8b889;
      background: #ffffff;
    }

    .eyebrow,
    .section-kicker,
    .editor-kicker {
      margin: 0 0 9px;
      color: var(--blue-700);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .page-title {
      max-width: 920px;
      margin: 0;
      color: var(--navy-950);
      font-size: clamp(24px, 3vw, 38px);
      font-weight: 760;
      letter-spacing: -0.035em;
      line-height: 1.15;
    }

    .page-subtitle {
      max-width: 760px;
      margin: 6px 0 0;
      color: var(--ink-500);
      font-size: clamp(14px, 1.35vw, 17px);
      line-height: 1.6;
    }

    .header-actions,
    .toolbar-actions,
    .editor-actions,
    .editor-footer-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 4px 12px rgba(13, 31, 66, 0.04);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 680;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .button:hover:not(:disabled) {
      border-color: #aebbd0;
      color: var(--blue-700);
      transform: translateY(-1px);
    }

    .button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .button svg {
      width: 17px;
      height: 17px;
      flex: none;
    }

    .button-primary {
      color: #ffffff;
      border-color: var(--navy-900);
      background: var(--navy-900);
      box-shadow: 0 10px 22px rgba(13, 31, 66, 0.18);
    }

    .button-primary:hover:not(:disabled) {
      color: #ffffff;
      border-color: var(--blue-700);
      background: var(--blue-700);
    }

    .button-quiet {
      min-height: 36px;
      padding: 0 12px;
      box-shadow: none;
      font-size: 13px;
    }

    .button-danger {
      color: #b42318;
      border-color: #f1cbc6;
      background: #fff8f7;
      box-shadow: none;
    }

    .roadmap-panel {
      overflow: hidden;
      border: 1px solid rgba(202, 211, 225, 0.9);
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.93);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
    }

    .roadmap-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 25px 28px 20px;
      border-bottom: 1px solid var(--line-soft);
    }

    .toolbar-actions {
      flex-wrap: nowrap;
    }

    .scroll-button {
      width: 42px;
      padding: 0;
    }

    .roadmap-viewport {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 24px 28px 18px;
      scroll-behavior: smooth;
      scroll-snap-type: x proximity;
      scrollbar-color: #aebbd0 transparent;
      scrollbar-width: thin;
    }

    .roadmap-viewport::-webkit-scrollbar {
      height: 9px;
    }

    .roadmap-viewport::-webkit-scrollbar-track {
      background: transparent;
    }

    .roadmap-viewport::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: #b9c5d6;
      background-clip: padding-box;
    }

    .roadmap-track {
      display: flex;
      align-items: stretch;
      gap: 18px;
      width: max-content;
      min-width: 100%;
    }

    .month-group {
      display: flex;
      flex: none;
      flex-direction: column;
      gap: 12px;
      min-width: var(--stage-width);
      scroll-snap-align: start;
    }

    .month-header {
      position: relative;
      overflow: hidden;
      min-height: 58px;
      padding: 0 20px;
      border-radius: 15px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--navy-950), var(--navy-800));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .month-header::after {
      position: absolute;
      right: -46px;
      bottom: -70px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(74, 138, 244, 0.17);
      content: "";
    }

    .month-title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 21px;
      font-weight: 760;
      letter-spacing: 0.01em;
    }

    .month-count {
      position: relative;
      z-index: 1;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 650;
    }

    .stage-row {
      display: flex;
      align-items: stretch;
      gap: 12px;
    }

    .stage-card {
      width: var(--stage-card-width, var(--stage-width));
      min-height: 470px;
      flex: none;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
    }

    .stage-header {
      padding: 19px 20px 17px;
      border-bottom: 1px solid var(--line-soft);
      background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
    }

    .stage-meta {
      margin: 0 0 8px;
      color: var(--blue-700);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stage-title {
      margin: 0;
      color: var(--navy-950);
      font-size: 19px;
      font-weight: 760;
      line-height: 1.3;
    }

    .stage-requirement-count {
      display: inline-flex;
      margin-top: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      color: var(--ink-700);
      background: #edf2f8;
      font-size: 11px;
      font-weight: 650;
    }

    .requirement-list {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
    }

    .requirement-column {
      width: calc(var(--stage-width) - 30px);
      flex: none;
      display: grid;
      align-content: start;
      gap: 11px;
    }

    .requirement-card {
      padding: 14px 14px 13px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      background: var(--surface-muted);
    }

    .requirement-title {
      margin: 0;
      color: var(--ink-900);
      font-size: 15px;
      font-weight: 720;
      line-height: 1.45;
    }

    .requirement-description {
      margin: 7px 0 13px;
      color: var(--ink-500);
      font-size: 12.5px;
      line-height: 1.62;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .requirement-card[data-progress-state="unreported"] .requirement-description {
      margin-bottom: 0;
    }

    .progress-summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    .progress-label {
      color: var(--blue-700);
      font-size: 22px;
      font-weight: 780;
      letter-spacing: -0.035em;
    }

    .progress-caption {
      color: var(--ink-500);
      font-size: 11px;
      font-weight: 630;
    }

    .progress-track {
      overflow: hidden;
      height: 7px;
      border-radius: 999px;
      background: #dde4ee;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue-600), var(--blue-500));
      transition: width 220ms ease;
    }

    .requirement-card[data-progress-state="complete"] .progress-label {
      color: var(--teal-600);
    }

    .requirement-card[data-progress-state="complete"] .progress-fill {
      background: var(--teal-600);
    }

    .progress-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 999px;
      color: #475467;
      background: #e9eef5;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.2;
    }

    .progress-status::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7b8ba5;
      content: '';
    }

    .empty-state {
      width: var(--stage-width);
      min-height: 180px;
      padding: 28px 22px;
      border: 1px dashed #bbc6d7;
      border-radius: var(--radius-lg);
      color: var(--ink-500);
      background: rgba(247, 249, 252, 0.76);
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    .roadmap-hint {
      margin: 0;
      padding: 5px 28px 23px;
      color: var(--ink-500);
      font-size: 12px;
      text-align: center;
    }

    .editor-backdrop {
      position: fixed;
      z-index: 100;
      inset: 0;
      background: rgba(8, 21, 47, 0.48);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: flex-end;
    }

    .editor-drawer {
      width: min(760px, 95vw);
      height: 100%;
      background: #f7f9fc;
      box-shadow: -22px 0 60px rgba(8, 21, 47, 0.2);
      display: flex;
      flex-direction: column;
      animation: drawer-in 180ms ease-out;
    }

    @keyframes drawer-in {
      from { transform: translateX(28px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .editor-header,
    .editor-footer {
      flex: none;
      padding: 19px 22px;
      border-bottom: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.96);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .editor-footer {
      border-top: 1px solid var(--line-strong);
      border-bottom: 0;
    }

    .editor-title {
      margin: 0;
      color: var(--navy-950);
      font-size: 22px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      background: #ffffff;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .editor-body {
      overflow-y: auto;
      padding: 20px 22px 28px;
    }

    .editor-lead {
      margin: 0 0 18px;
      color: var(--ink-500);
      font-size: 13px;
      line-height: 1.7;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field-label {
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 700;
    }

    .field-input,
    .field-textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--ink-900);
      background: #ffffff;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .field-input {
      min-height: 42px;
      padding: 0 12px;
    }

    .field-textarea {
      min-height: 76px;
      padding: 10px 12px;
      resize: vertical;
      line-height: 1.55;
    }

    .field-input:focus,
    .field-textarea:focus {
      border-color: var(--blue-700);
      outline: 2px solid #ffffff;
      outline-offset: 0;
      box-shadow: 0 0 0 4px var(--blue-700);
    }

    .field-input[aria-invalid="true"] {
      border-color: #b42318;
      box-shadow: 0 0 0 3px rgba(180, 35, 24, 0.11);
    }

    .editor-project-field {
      margin-bottom: 19px;
      padding: 16px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: #ffffff;
    }

    .editor-months {
      display: grid;
      gap: 16px;
    }

    .editor-month,
    .editor-stage,
    .editor-requirement {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: #ffffff;
    }

    .editor-month {
      overflow: hidden;
    }

    .editor-block-header {
      padding: 14px 15px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .editor-block-title {
      margin: 0;
      color: var(--navy-950);
      font-size: 14px;
      font-weight: 760;
    }

    .editor-month-content {
      display: grid;
      gap: 13px;
      padding: 15px;
      background: #f3f6fa;
    }

    .editor-stage {
      overflow: hidden;
      border-radius: var(--radius-md);
    }

    .editor-stage-content {
      display: grid;
      gap: 11px;
      padding: 13px;
    }

    .editor-requirement {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 108px;
      gap: 11px;
      min-width: 0;
      margin: 0;
      padding: 12px;
      border-radius: 11px;
      background: var(--surface-muted);
    }

    .sr-only {
      position: absolute;
      overflow: hidden;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      border: 0;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .editor-requirement-main {
      display: grid;
      gap: 10px;
    }

    .editor-requirement-side {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .editor-insert-requirement {
      width: 100%;
      min-height: 32px;
      margin-top: -5px;
      border-style: dashed;
      color: var(--blue-700);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: none;
      font-size: 12px;
    }

    .editor-empty {
      margin: 0;
      padding: 16px;
      border: 1px dashed #bac6d7;
      border-radius: 10px;
      color: var(--ink-500);
      text-align: center;
      font-size: 12px;
    }

    .editor-add-month {
      width: 100%;
      margin-top: 16px;
    }

    .editor-status {
      color: var(--ink-500);
      font-size: 12px;
    }

    .editor-status[data-kind="warning"] {
      color: #9a3f12;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      z-index: 200;
      right: 24px;
      bottom: 24px;
      max-width: min(420px, calc(100vw - 48px));
      padding: 13px 17px;
      border: 1px solid #bdd6ca;
      border-radius: 12px;
      color: #0d513f;
      background: #ecfdf5;
      box-shadow: 0 16px 38px rgba(8, 21, 47, 0.18);
      font-size: 13px;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast[data-kind="warning"] {
      color: #7a2e0e;
      border-color: #f4c7a6;
      background: #fff7ed;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      :root {
        --stage-width: min(82vw, 318px);
      }

      .app-shell {
        padding: 22px 16px 32px;
      }

      .page-header,
      .roadmap-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .persistence-warning {
        align-items: stretch;
        flex-direction: column;
      }

      .header-actions {
        width: 100%;
      }

      .header-actions .button {
        flex: 1 1 auto;
      }

      .roadmap-toolbar,
      .roadmap-viewport {
        padding-right: 18px;
        padding-left: 18px;
      }

      .roadmap-hint {
        padding-right: 18px;
        padding-left: 18px;
      }

      .editor-drawer {
        width: 100%;
      }
    }

    @media (max-width: 560px) {
      .header-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .header-actions .button-primary {
        grid-column: 1 / -1;
      }

      .roadmap-toolbar {
        padding-top: 19px;
      }

      .editor-header,
      .editor-footer,
      .editor-body {
        padding-right: 15px;
        padding-left: 15px;
      }

      .editor-requirement {
        grid-template-columns: 1fr;
      }

      .editor-requirement-side {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
      }

      .editor-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .editor-footer-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      #saveEditorButton {
        grid-column: 1 / -1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Project milestone roadmap</p>
        <p class="page-subtitle">按月份汇总多个阶段，聚焦重点需求描述与截至阶段的累计总进度。</p>
      </div>
      <div class="header-actions" aria-label="路线图操作">
        <button class="button button-primary" id="editButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Zm11.5-13.5 2 2M13 5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          编辑路线图
        </button>
        <button class="button" id="exportButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          导出备份
        </button>
        <button class="button" id="imageExportButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM7 15l3-3 3 3 2-2 3 3M8.5 9.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          导出完整图片
        </button>
        <button class="button" id="importButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0 4 4m-4-4L8 8M5 17v3h14v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          导入备份
        </button>
        <input id="importInput" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <div class="persistence-warning" id="persistenceWarning" role="alert" hidden>
      <p class="persistence-warning-copy" id="persistenceWarningText"></p>

  <script data-roadmap-core>

      const STORAGE_KEY = storageKeyForPath(

      );
      const LIMITS = Object.freeze({

        requirementDescription: 300,
        id: 120,
        months: 36,

      let idCounter = 0;

          {

                requirements: [
                  {

                    description: '持续配合数仓规范落地，整体交付9月30日',
                    progress: null
                  },
                  {
                    id: 'platform-eleven',
                    title: '11平台订单与报告解析',
                    description: 'Wildberries / Kaufman / LeroyMerlin / Joom / 乐天 / Yandex / TD / Bol / Fruugo / Fyn / Jumia 平台 OMS 接口统一对接',
                    progress: null
